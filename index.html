<html lang="fr">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#94A3B8;font-size:14px">Chargement...</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function(){
var ce=React.createElement,us=React.useState,ur=React.useRef;
var TYPES=[
{id:"shelf",label:"Rayon",emoji:"S",desc:"PDL, facings, ruptures"},
{id:"price",label:"Balisage Prix",emoji:"P",desc:"Verification PVC"},
{id:"promo",label:"Mise en Avant",emoji:"M",desc:"TG, ilots, stop-rayon"},
{id:"leaflet",label:"Prospectus",emoji:"L",desc:"Share of Leaflet"},
{id:"posm",label:"PLV / POSM",emoji:"V",desc:"Share of POSM"},
{id:"complete",label:"Audit Complet",emoji:"A",desc:"Tous les modules"}
];
var COLORS={"S":"#2563EB","P":"#D97706","M":"#DC2626","L":"#7C3AED","V":"#059669","A":"#0F172A"};
var STORES=[
{id:"s1",name:"Marjane Ain Sebaa"},{id:"s2",name:"Carrefour Market Maarif"},
{id:"s3",name:"Acima Bd Anfa"},{id:"s4",name:"BIM Hay Hassani"},
{id:"s5",name:"Marjane Tanger City"},{id:"s6",name:"Atacadao Kenitra"},
{id:"s7",name:"Aswak Assalam Rabat"},{id:"s8",name:"LabelVie Marrakech"}
];
var AC="#C41E3A",DK="#0F172A",DA="#1E293B",BL="#2563EB",GN="#059669",OR="#D97706",DG="#DC2626",SF="#FFFFFF",BG="#F5F6FA",SC="#64748B",MT="#94A3B8",BD="#E2E8F0";
var IS={width:"100%",padding:"14px 16px",borderRadius:"12px",border:"1px solid "+DA,background:DA,color:"#fff",fontSize:"15px",marginBottom:"10px",outline:"none",fontFamily:"inherit",boxSizing:"border-box"};

function App(){
var a=us(“login”),scr=a[0],setScr=a[1];
var b=us(null),user=b[0],setUser=b[1];
var c=us(null),selS=c[0],setSelS=c[1];
var d=us(null),selT=d[0],setSelT=d[1];
var e=us(null),img=e[0],setImg=e[1];
var f=us(false),busy=f[0],setBusy=f[1];
var g=us(null),res=g[0],setRes=g[1];
var j=us([]),auds=j[0],setAuds=j[1];
var fR=ur(null);

function doCapture(ev){
var file=ev.target.files&&ev.target.files[0];
if(!file)return;
var reader=new FileReader();
reader.onload=function(re){setImg({url:re.target.result});setScr(“result”);doAnalyze();};
reader.readAsDataURL(file);
}

function doAnalyze(){
setBusy(true);setRes(null);
setTimeout(function(){
var own=[
{brand:“NIVEA”,facings:4+Math.floor(Math.random()*5),oos:Math.random()>.7?1:0},
{brand:“Gillette”,facings:2+Math.floor(Math.random()*4),oos:Math.random()>.8?1:0},
{brand:“AVON”,facings:1+Math.floor(Math.random()*3),oos:Math.random()>.75?1:0},
{brand:“WELLA”,facings:1+Math.floor(Math.random()*3),oos:0},
{brand:“HKS”,facings:1+Math.floor(Math.random()*2),oos:Math.random()>.7?1:0},
{brand:“KALINE”,facings:1+Math.floor(Math.random()*2),oos:0}
];
var ownT=0,oosC=0,i;
for(i=0;i<own.length;i++){ownT+=own[i].facings;oosC+=own[i].oos;}
var compT=28+Math.floor(Math.random()*15),tot=ownT+compT;
var score=Math.floor(65+Math.random()*30);
var kk={pdl:((ownT/tot)*100).toFixed(1),totalF:tot,ownF:ownT,oosC:oosC,oosR:((oosC/Math.max(ownT+oosC,1))*100).toFixed(1),linT:tot*8,linO:ownT*8,priceC:(82+Math.random()*16).toFixed(1)};
var oosList=[];
for(i=0;i<own.length;i++){if(own[i].oos>0)oosList.push({brand:own[i].brand});}
setRes({score:score,kpis:kk,own:own,oos:oosList});
setAuds(function(p){return[{id:Date.now(),store:selS?selS.name:”-”,type:selT?selT.label:”-”,score:score,date:new Date().toLocaleString(“fr-FR”),pdl:kk.pdl,oos:oosC}].concat(p);});
setBusy(false);
},2200);
}

function reset(){setImg(null);setRes(null);setSelT(null);setScr(“home”);}

var isNav=scr===“home”||scr===“history”||scr===“profile”;
var content=null;

if(scr===“login”){
content=ce(LoginScr,{onLogin:function(em){setUser({id:“u1”,email:em,full_name:em.split(”@”)[0],role:“dgd”});setScr(“home”);},onReg:function(){setScr(“register”);}});
}else if(scr===“register”){
content=ce(RegScr,{onReg:function(em,nm){setUser({id:“u1”,email:em,full_name:nm,role:“dgd”});setScr(“home”);},onBack:function(){setScr(“login”);}});
}else if(scr===“home”){
content=ce(HomeScr,{user:user,stores:STORES,sel:selS,setSel:setSelS,go:function(t){setSelT(t);if(!selS)setSelS(STORES[0]);setScr(“capture”);}});
}else if(scr===“capture”){
content=ce(CapScr,{type:selT,store:selS,fR:fR,onBack:function(){setScr(“home”);}});
}else if(scr===“result”){
content=ce(ResScr,{img:img,busy:busy,res:res,type:selT,store:selS,onReset:reset});
}else if(scr===“history”){
content=ce(HistScr,{audits:auds});
}else if(scr===“profile”){
content=ce(ProfScr,{user:user,onLogout:function(){setUser(null);setScr(“login”);}});
}

var nav=null;
if(isNav){
var tabs=[[“home”,“Accueil”],[“history”,“Audits”],[“profile”,“Profil”]];
nav=ce(“div”,{style:{position:“fixed”,bottom:0,left:“50%”,transform:“translateX(-50%)”,width:“100%”,maxWidth:“430px”,background:“rgba(255,255,255,.97)”,borderTop:“1px solid “+BD,display:“flex”,justifyContent:“space-around”,padding:“10px 0 14px”,zIndex:100}},
tabs.map(function(t){
var act=scr===t[0];
return ce(“button”,{key:t[0],onClick:function(){setScr(t[0]);},style:{background:“none”,border:“none”,cursor:“pointer”,display:“flex”,flexDirection:“column”,alignItems:“center”,gap:“3px”,color:act?AC:MT,padding:“4px 20px”}},
ce(“div”,{style:{width:“6px”,height:“6px”,borderRadius:“50%”,background:act?AC:“transparent”}}),
ce(“span”,{style:{fontSize:“11px”,fontWeight:act?“700”:“400”}},t[1])
);
})
);
}

return ce(“div”,{style:{minHeight:“100vh”,maxWidth:“430px”,margin:“0 auto”,background:BG,position:“relative”}},
ce(“div”,{style:{paddingBottom:isNav?“70px”:“0”,minHeight:“100vh”}},content),
nav,
ce(“input”,{ref:fR,type:“file”,accept:“image/*”,capture:“environment”,onChange:doCapture,style:{display:“none”}})
);
}

function LoginScr(p){
var a=us(””),em=a[0],sE=a[1];
var b=us(””),pw=b[0],sP=b[1];
return ce(“div”,{style:{minHeight:“100vh”,display:“flex”,flexDirection:“column”,justifyContent:“center”,padding:“24px”,background:DK}},
ce(“div”,{style:{textAlign:“center”,marginBottom:“40px”}},
ce(“div”,{style:{width:“60px”,height:“60px”,borderRadius:“16px”,margin:“0 auto 16px”,background:“linear-gradient(135deg,#C41E3A,#8B2252)”,display:“flex”,alignItems:“center”,justifyContent:“center”,fontSize:“14px”,fontWeight:“800”,color:”#fff”,letterSpacing:“1px”}},“SS”),
ce(“div”,{style:{fontSize:“28px”,fontWeight:“800”,color:”#fff”}},“ShelfScan”,ce(“span”,{style:{color:AC}},“Pro”)),
ce(“div”,{style:{fontSize:“12px”,color:MT,marginTop:“4px”,letterSpacing:“2px”}},“DISLOG GROUP”)
),
ce(“div”,null,
ce(“input”,{value:em,onChange:function(x){sE(x.target.value);},placeholder:“Email”,type:“email”,style:IS}),
ce(“input”,{value:pw,onChange:function(x){sP(x.target.value);},placeholder:“Mot de passe”,type:“password”,style:IS}),
ce(“button”,{onClick:function(){if(em&&pw)p.onLogin(em);},style:{width:“100%”,padding:“15px”,borderRadius:“12px”,border:“none”,background:AC,color:”#fff”,fontSize:“15px”,fontWeight:“700”,cursor:“pointer”,marginTop:“6px”}},“Se connecter”),
ce(“button”,{onClick:p.onReg,style:{width:“100%”,padding:“12px”,marginTop:“10px”,borderRadius:“12px”,border:“1px solid “+DA,background:“transparent”,color:MT,fontSize:“13px”,cursor:“pointer”}},“Creer un compte”)
)
);
}

function RegScr(p){
var a=us(””),nm=a[0],sN=a[1];
var b=us(””),em=b[0],sE=b[1];
var c=us(””),pw=c[0],sP=c[1];
return ce(“div”,{style:{minHeight:“100vh”,display:“flex”,flexDirection:“column”,justifyContent:“center”,padding:“24px”,background:DK}},
ce(“div”,{style:{textAlign:“center”,marginBottom:“32px”}},
ce(“div”,{style:{fontSize:“24px”,fontWeight:“800”,color:”#fff”}},“Creer un compte”),
ce(“div”,{style:{fontSize:“12px”,color:MT,marginTop:“4px”}},“ShelfScan Pro”)
),
ce(“div”,null,
ce(“input”,{value:nm,onChange:function(x){sN(x.target.value);},placeholder:“Nom complet”,style:IS}),
ce(“input”,{value:em,onChange:function(x){sE(x.target.value);},placeholder:“Email”,type:“email”,style:IS}),
ce(“input”,{value:pw,onChange:function(x){sP(x.target.value);},placeholder:“Mot de passe”,type:“password”,style:IS}),
ce(“button”,{onClick:function(){if(nm&&em&&pw)p.onReg(em,nm);},style:{width:“100%”,padding:“15px”,borderRadius:“12px”,border:“none”,background:AC,color:”#fff”,fontSize:“15px”,fontWeight:“700”,cursor:“pointer”,marginTop:“6px”}},“Creer mon compte”),
ce(“button”,{onClick:p.onBack,style:{width:“100%”,padding:“12px”,marginTop:“10px”,borderRadius:“12px”,border:“none”,background:“transparent”,color:MT,fontSize:“13px”,cursor:“pointer”}},“Deja un compte ? Se connecter”)
)
);
}

function HomeScr(p){
var u=p.user||{};
return ce(“div”,{style:{padding:“16px 16px 20px”}},
ce(“div”,{style:{display:“flex”,justifyContent:“space-between”,alignItems:“center”,marginBottom:“20px”}},
ce(“div”,null,
ce(“div”,{style:{fontSize:“13px”,color:SC}},“Bonjour,”),
ce(“div”,{style:{fontSize:“22px”,fontWeight:“800”}},u.full_name||“User”)
),
ce(“div”,{style:{width:“42px”,height:“42px”,borderRadius:“12px”,background:“linear-gradient(135deg,#C41E3A,#8B2252)”,display:“flex”,alignItems:“center”,justifyContent:“center”,color:”#fff”,fontSize:“16px”,fontWeight:“700”}},(u.full_name||“U”).charAt(0))
),
ce(“div”,{style:{marginBottom:“20px”}},
ce(“div”,{style:{fontSize:“11px”,fontWeight:“600”,color:SC,marginBottom:“6px”,textTransform:“uppercase”,letterSpacing:“1px”}},“Point de vente”),
ce(“select”,{value:(p.sel&&p.sel.id)||””,onChange:function(ev){var s=p.stores.find(function(x){return x.id===ev.target.value;});p.setSel(s);},style:{width:“100%”,padding:“12px”,borderRadius:“12px”,border:“1px solid “+BD,background:SF,fontSize:“14px”,fontFamily:“inherit”}},
ce(“option”,{value:””},”– Selectionner –”),
p.stores.map(function(s){return ce(“option”,{key:s.id,value:s.id},s.name);})
)
),
ce(“div”,null,
ce(“div”,{style:{fontSize:“11px”,fontWeight:“600”,color:SC,marginBottom:“10px”,textTransform:“uppercase”,letterSpacing:“1px”}},“Type d’audit”),
ce(“div”,{style:{display:“grid”,gridTemplateColumns:“1fr 1fr”,gap:“10px”}},
TYPES.map(function(t){return ce(“button”,{key:t.id,onClick:function(){p.go(t);},style:{background:SF,border:“1px solid “+BD,borderRadius:“14px”,padding:“18px 14px”,cursor:“pointer”,textAlign:“left”,fontFamily:“inherit”,position:“relative”}},
ce(“div”,{style:{width:“36px”,height:“36px”,borderRadius:“10px”,background:COLORS[t.emoji]||BL,display:“flex”,alignItems:“center”,justifyContent:“center”,color:”#fff”,fontSize:“14px”,fontWeight:“800”,marginBottom:“10px”}},t.emoji),
ce(“div”,{style:{fontSize:“13px”,fontWeight:“700”,marginBottom:“3px”}},t.label),
ce(“div”,{style:{fontSize:“11px”,color:SC}},t.desc)
);})
)
)
);
}

function CapScr(p){
return ce(“div”,{style:{minHeight:“100vh”,display:“flex”,flexDirection:“column”,background:DK}},
ce(“div”,{style:{padding:“16px”,display:“flex”,alignItems:“center”,gap:“12px”}},
ce(“button”,{onClick:p.onBack,style:{background:“none”,border:“none”,color:”#fff”,cursor:“pointer”,fontSize:“20px”,padding:“4px”}},”<”),
ce(“div”,null,
ce(“div”,{style:{fontSize:“16px”,fontWeight:“700”,color:”#fff”}},(p.type&&p.type.label)||“Audit”),
ce(“div”,{style:{fontSize:“11px”,color:MT}},(p.store&&p.store.name)||””)
)
),
ce(“div”,{style:{flex:1,display:“flex”,flexDirection:“column”,alignItems:“center”,justifyContent:“center”,padding:“20px”}},
ce(“div”,{style:{width:“80%”,maxWidth:“280px”,aspectRatio:“3/4”,border:“3px dashed rgba(148,163,184,.4)”,borderRadius:“20px”,display:“flex”,flexDirection:“column”,alignItems:“center”,justifyContent:“center”,gap:“16px”,padding:“24px”}},
ce(“div”,{style:{width:“64px”,height:“64px”,borderRadius:“50%”,background:“rgba(196,30,58,.15)”,display:“flex”,alignItems:“center”,justifyContent:“center”,color:AC,fontSize:“14px”,fontWeight:“800”}},“CAM”),
ce(“div”,{style:{color:”#fff”,fontSize:“16px”,fontWeight:“600”,textAlign:“center”}},“Photographiez le rayon”),
ce(“div”,{style:{color:MT,fontSize:“12px”,textAlign:“center”}},“Cadrez le rayon entier”)
),
ce(“button”,{onClick:function(){p.fR.current&&p.fR.current.click();},style:{marginTop:“32px”,width:“72px”,height:“72px”,borderRadius:“50%”,background:AC,border:“4px solid rgba(196,30,58,.3)”,cursor:“pointer”,color:”#fff”,fontSize:“14px”,fontWeight:“800”,boxShadow:“0 0 30px rgba(196,30,58,.4)”}},“PHOTO”),
ce(“div”,{style:{marginTop:“10px”,fontSize:“12px”,color:MT}},“Appuyez pour capturer”)
)
);
}

function ResScr(p){
var k=(p.res&&p.res.kpis)||{};
return ce(“div”,{style:{minHeight:“100vh”,background:BG}},
ce(“div”,{style:{position:“relative”,width:“100%”,maxHeight:“220px”,overflow:“hidden”}},
p.img?ce(“img”,{src:p.img.url,style:{width:“100%”,display:“block”,objectFit:“cover”,maxHeight:“220px”}}):null,
p.busy?ce(“div”,{style:{position:“absolute”,top:0,left:0,right:0,bottom:0,background:“rgba(0,0,0,.6)”,display:“flex”,flexDirection:“column”,alignItems:“center”,justifyContent:“center”,gap:“12px”}},
ce(“div”,{style:{width:“40px”,height:“40px”,borderRadius:“50%”,border:“3px solid “+DA,borderTopColor:AC,animation:“spin .8s linear infinite”}}),
ce(“span”,{style:{fontSize:“14px”,color:AC,fontWeight:“600”}},“Analyse IA en cours…”),
ce(“style”,null,”@keyframes spin{to{transform:rotate(360deg)}}”)
):null,
(!p.busy&&p.res)?ce(“div”,{style:{position:“absolute”,bottom:“12px”,left:“12px”,right:“12px”,background:“rgba(0,0,0,.7)”,borderRadius:“10px”,padding:“8px 14px”,display:“flex”,alignItems:“center”,gap:“8px”}},
ce(“div”,{style:{width:“20px”,height:“20px”,borderRadius:“50%”,background:GN,display:“flex”,alignItems:“center”,justifyContent:“center”,color:”#fff”,fontSize:“12px”,fontWeight:“800”}},“OK”),
ce(“span”,{style:{fontSize:“13px”,fontWeight:“600”,color:”#fff”}},“Score “+p.res.score+”/100”)
):null
),
ce(“div”,{style:{padding:“12px 16px 0”}},
ce(“div”,{style:{fontSize:“18px”,fontWeight:“800”}},(p.type&&p.type.label)||“Audit”),
ce(“div”,{style:{fontSize:“12px”,color:SC}},(p.store&&p.store.name)||””)
),
(p.res&&!p.busy)?ce(“div”,{style:{padding:“16px”}},
ce(“div”,{style:{display:“grid”,gridTemplateColumns:“1fr 1fr”,gap:“10px”}},
ce(KPI,{l:“Part de Lineaire”,v:k.pdl+”%”,c:BL}),
ce(KPI,{l:“Facings Dislog”,v:””+k.ownF,s:”/ “+k.totalF+” total”,c:AC}),
ce(KPI,{l:“Ruptures (OOS)”,v:””+k.oosC,c:k.oosC>3?DG:GN}),
ce(KPI,{l:“Taux Rupture”,v:k.oosR+”%”,c:OR}),
ce(KPI,{l:“Lineaire Total”,v:k.linT+” cm”,c:SC}),
ce(KPI,{l:“Conformite Prix”,v:k.priceC+”%”,c:parseFloat(k.priceC)>=90?GN:OR})
),
(p.res.oos&&p.res.oos.length>0)?ce(“div”,{style:{marginTop:“14px”,padding:“14px”,borderRadius:“12px”,background:”#FEF2F2”,border:“1px solid #FECACA”}},
ce(“div”,{style:{fontSize:“13px”,fontWeight:“700”,color:DG,marginBottom:“8px”}},”! Ruptures detectees”),
p.res.oos.map(function(o,i){return ce(“div”,{key:i,style:{fontSize:“12px”,padding:“6px 0”}},o.brand+” - ref. a identifier”);})
):null,
p.res.own?ce(“div”,{style:{marginTop:“14px”,padding:“14px”,borderRadius:“12px”,background:SF,border:“1px solid “+BD}},
ce(“div”,{style:{fontSize:“13px”,fontWeight:“700”,marginBottom:“10px”}},“Detail par marque Dislog”),
p.res.own.map(function(bb,i){return ce(“div”,{key:i,style:{display:“flex”,justifyContent:“space-between”,padding:“7px 0”,borderBottom:i<p.res.own.length-1?“1px solid “+BD:“none”}},
ce(“span”,{style:{fontSize:“12px”,fontWeight:“600”}},bb.brand),
ce(“span”,{style:{fontSize:“12px”,fontWeight:“600”,color:bb.oos>0?DG:GN}},bb.facings+” fac.”+(bb.oos>0?” | “+bb.oos+” OOS”:” OK”))
);})
):null,
ce(“div”,{style:{display:“flex”,gap:“10px”,marginTop:“20px”}},
ce(“button”,{onClick:p.onReset,style:{flex:1,padding:“14px”,borderRadius:“12px”,border:“1px solid “+BD,background:SF,fontSize:“14px”,fontWeight:“600”,cursor:“pointer”,fontFamily:“inherit”}},“Nouvel Audit”),
ce(“button”,{onClick:p.onReset,style:{flex:1,padding:“14px”,borderRadius:“12px”,border:“none”,background:AC,color:”#fff”,fontSize:“14px”,fontWeight:“600”,cursor:“pointer”,fontFamily:“inherit”}},“Terminer”)
)
):null
);
}

function KPI(p){
return ce(“div”,{style:{background:SF,borderRadius:“12px”,padding:“14px 12px”,border:“1px solid “+BD}},
ce(“div”,{style:{fontSize:“10px”,color:SC,marginBottom:“6px”}},p.l),
ce(“div”,{style:{fontSize:“22px”,fontWeight:“800”,color:p.c}},p.v),

);
}

return ce(“div”,{style:{padding:“16px”}},
ce(“div”,{style:{fontSize:“22px”,fontWeight:“800”,marginBottom:“16px”}},“Historique des Audits”),
p.audits.length===0?ce(“div”,{style:{textAlign:“center”,padding:“40px”,color:MT}},
ce(“div”,{style:{fontSize:“14px”}},“Aucun audit realise”),
ce(“div”,{style:{fontSize:“12px”,marginTop:“4px”}},“Vos audits apparaitront ici”)
):null,
p.audits.map(function(aa){return ce(“div”,{key:aa.id,style:{background:SF,border:“1px solid “+BD,borderRadius:“12px”,padding:“14px 16px”,marginBottom:“8px”}},
ce(“div”,{style:{display:“flex”,justifyContent:“space-between”,marginBottom:“4px”}},
ce(“span”,{style:{fontWeight:“700”,fontSize:“14px”}},aa.store),
ce(“span”,{style:{fontSize:“18px”,fontWeight:“800”,color:aa.score>=80?GN:aa.score>=65?OR:DG}},aa.score)
),
ce(“div”,{style:{fontSize:“11px”,color:SC}},aa.type+” | PDL “+aa.pdl+”% | “+aa.oos+” OOS”),
ce(“div”,{style:{fontSize:“10px”,color:MT,marginTop:“4px”}},aa.date)

);
}

function ProfScr(p){
var u=p.user||{};
return ce(“div”,{style:{padding:“16px”}},
ce(“div”,{style:{textAlign:“center”,marginTop:“20px”,marginBottom:“30px”}},
ce(“div”,{style:{width:“72px”,height:“72px”,borderRadius:“20px”,margin:“0 auto 12px”,background:“linear-gradient(135deg,#C41E3A,#8B2252)”,display:“flex”,alignItems:“center”,justifyContent:“center”,color:”#fff”,fontSize:“28px”,fontWeight:“700”}},(u.full_name||“U”).charAt(0)),
ce(“div”,{style:{fontSize:“20px”,fontWeight:“700”}},u.full_name||””),
ce(“div”,{style:{fontSize:“13px”,color:SC}},u.email||””),
ce(“div”,{style:{display:“inline-block”,marginTop:“8px”,padding:“4px 14px”,borderRadius:“8px”,background:”#FDE8EC”,color:AC,fontSize:“11px”,fontWeight:“600”,textTransform:“uppercase”}},u.role||“user”)
