<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F172A">
<title>ShelfScan Pro — Dislog Group</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{font-family:'Outfit',-apple-system,sans-serif;background:#F5F6FA;color:#0F172A;-webkit-font-smoothing:antialiased}
input,select,button{font-family:inherit;outline:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:9px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const React = window.React;
const {useState,useEffect,useRef} = React;
const ReactDOM = window.ReactDOM;

const API=“https://shelfscan-backend-production.up.railway.app”;

const TYPES=[
{id:“shelf”,label:“Rayon / Lin\u00e9aire”,emoji:”\ud83d\udcca”,color:”#2563EB”,desc:“PDL, facings, ruptures”},
{id:“price”,label:“Balisage & Prix”,emoji:”\ud83c\udff7\ufe0f”,color:”#D97706”,desc:“V\u00e9rification PVC”},
{id:“promo”,label:“Mise en Avant”,emoji:”\ud83d\udce3”,color:”#DC2626”,desc:“TG, \u00eelots, stop-rayon”},
{id:“leaflet”,label:“Prospectus”,emoji:”\ud83d\udcf0”,color:”#7C3AED”,desc:“Share of Leaflet”},
{id:“posm”,label:“PLV / POSM”,emoji:”\ud83e\udea7”,color:”#059669”,desc:“Share of POSM”},
{id:“complete”,label:“Audit Complet”,emoji:”\u2705”,color:”#0F172A”,desc:“Tous les modules”},
];

const STORES=[
{id:“s1”,name:“Marjane Ain Sebaa”,enseigne:“Marjane”,city:“Casablanca”},
{id:“s2”,name:“Carrefour Market Maarif”,enseigne:“Carrefour”,city:“Casablanca”},
{id:“s3”,name:“Acima Bd Anfa”,enseigne:“Acima”,city:“Casablanca”},
{id:“s4”,name:“BIM Hay Hassani”,enseigne:“BIM”,city:“Casablanca”},
{id:“s5”,name:“Marjane Tanger City”,enseigne:“Marjane”,city:“Tanger”},
{id:“s6”,name:“Atacad\u00e3o K\u00e9nitra”,enseigne:“Atacad\u00e3o”,city:“K\u00e9nitra”},
{id:“s7”,name:“Aswak Assalam Rabat”,enseigne:“Aswak Assalam”,city:“Rabat”},
{id:“s8”,name:“Label’Vie Marrakech”,enseigne:“Label’Vie”,city:“Marrakech”},
];

const T={bg:”#F5F6FA”,sf:”#FFFFFF”,dk:”#0F172A”,da:”#1E293B”,ac:”#C41E3A”,al:”#FDE8EC”,bl:”#2563EB”,gn:”#059669”,or:”#D97706”,dg:”#DC2626”,tx:”#0F172A”,sc:”#64748B”,mt:”#94A3B8”,bd:”#E2E8F0”};

function h(tag,props,…ch){return React.createElement(tag,props,…ch)}

function App(){
const[scr,setScr]=useState(“login”);
const[user,setUser]=useState(null);
const[stores]=useState(STORES);
const[selS,setSelS]=useState(null);
const[selT,setSelT]=useState(null);
const[img,setImg]=useState(null);
const[busy,setBusy]=useState(false);
const[res,setRes]=useState(null);
const[err,setErr]=useState(””);
const[ld,setLd]=useState(false);
const[auds,setAuds]=useState([]);
const fR=useRef(null);

function doLogin(email,pw){
setLd(true);
setUser({id:“u1”,email:email,full_name:email.split(”@”)[0],role:“dgd”,region:“National”});
setScr(“home”);
setLd(false);
}

function doReg(email,pw,name){
setLd(true);
setUser({id:“u1”,email:email,full_name:name,role:“dgd”,region:“National”});
setScr(“home”);
setLd(false);
}

function doCapture(e){
var f=e.target.files&&e.target.files[0];
if(!f)return;
var r=new FileReader();
r.onload=function(ev){
setImg({url:ev.target.result});
setScr(“result”);
doAnalyze();
};
r.readAsDataURL(f);
}

function doAnalyze(){
setBusy(true);setRes(null);
setTimeout(function(){
var own=[
{brand:“NIVEA”,facings:4+Math.floor(Math.random()*5),oos:Math.random()>.7?1:0},
{brand:“Gillette”,facings:2+Math.floor(Math.random()*4),oos:Math.random()>.8?1:0},
{brand:“AVON”,facings:1+Math.floor(Math.random()*3),oos:Math.random()>.75?1:0},
{brand:“WELLA”,facings:1+Math.floor(Math.random()*3),oos:0},
{brand:“HKS”,facings:1+Math.floor(Math.random()*2),oos:Math.random()>.7?1:0},
{brand:“KALINE”,facings:1+Math.floor(Math.random()*2),oos:0},
];
var ownT=0;for(var i=0;i<own.length;i++)ownT+=own[i].facings;
var compT=28+Math.floor(Math.random()*15);
var tot=ownT+compT;
var oosC=0;for(var i=0;i<own.length;i++)oosC+=own[i].oos;
var score=Math.floor(65+Math.random()*30);
var r={
score:score,
kpis:{pdl:((ownT/tot)*100).toFixed(1),totalF:tot,ownF:ownT,oosC:oosC,oosR:((oosC/(ownT+oosC))*100).toFixed(1),linT:tot*8,linO:ownT*8,priceC:(82+Math.random()*16).toFixed(1)},
own:own,
oos:own.filter(function(b){return b.oos>0}).map(function(b){return{brand:b.brand,sku:b.brand+” \u2014 r\u00e9f. \u00e0 identifier”}}),
};
setRes(r);
setAuds(function(prev){return[{id:Date.now(),store:selS?selS.name:”\u2014”,type:selT?selT.label:”\u2014”,score:score,date:new Date().toLocaleString(“fr-FR”),pdl:r.kpis.pdl,oos:oosC}].concat(prev)});
setBusy(false);
},2200);
}

function reset(){setImg(null);setRes(null);setSelT(null);setScr(“home”);}

var isNav=scr===“home”||scr===“history”||scr===“profile”;

// ─── RENDER ───
var content=null;
if(scr===“login”)content=h(LoginScr,{onLogin:doLogin,onReg:function(){setErr(””);setScr(“register”)},err:err,ld:ld});
if(scr===“register”)content=h(RegScr,{onReg:doReg,onLogin:function(){setErr(””);setScr(“login”)},err:err,ld:ld});
if(scr===“home”)content=h(HomeScr,{user:user,stores:stores,sel:selS,setSel:setSelS,setType:function(t){setSelT(t);if(!selS&&stores.length)setSelS(stores[0]);setScr(“capture”)}});
if(scr===“capture”)content=h(CapScr,{type:selT,store:selS,fRef:fR,onBack:function(){setScr(“home”)}});
if(scr===“result”)content=h(ResScr,{img:img,busy:busy,res:res,type:selT,store:selS,onReset:reset});
if(scr===“history”)content=h(HistScr,{audits:auds});
if(scr===“profile”)content=h(ProfScr,{user:user,onLogout:function(){setUser(null);setScr(“login”)}});

var nav=null;
if(isNav){
nav=h(“nav”,{style:{position:“absolute”,bottom:0,left:0,right:0,background:“rgba(255,255,255,.95)”,backdropFilter:“blur(12px)”,borderTop:“1px solid “+T.bd,display:“flex”,justifyContent:“space-around”,padding:“8px 0 12px”}},
[{id:“home”,l:“Accueil”,icon:”\ud83c\udfe0”},{id:“history”,l:“Audits”,icon:”\ud83d\udccb”},{id:“profile”,l:“Profil”,icon:”\ud83d\udc64”}].map(function(t){
var a=scr===t.id;
return h(“button”,{key:t.id,onClick:function(){setScr(t.id)},style:{background:“none”,border:“none”,cursor:“pointer”,display:“flex”,flexDirection:“column”,alignItems:“center”,gap:“2px”,color:a?T.ac:T.mt,padding:“4px 16px”,position:“relative”,fontSize:“10px”}},
a?h(“div”,{style:{position:“absolute”,top:”-8px”,width:“24px”,height:“3px”,borderRadius:“2px”,background:T.ac}}):null,
h(“span”,{style:{fontSize:“18px”}},t.icon),
h(“span”,{style:{fontWeight:a?“600”:“400”}},t.l)
);
})
);
}

return h(“div”,{style:{height:“100vh”,display:“flex”,flexDirection:“column”,maxWidth:“430px”,margin:“0 auto”,background:T.bg,position:“relative”,overflow:“hidden”,fontFamily:”‘Outfit’,-apple-system,sans-serif”}},
h(“div”,{style:{flex:1,overflow:“auto”,paddingBottom:isNav?“70px”:“0”}},content),
nav,
h(“input”,{ref:fR,type:“file”,accept:“image/*”,capture:“environment”,onChange:doCapture,style:{display:“none”}})
);
}

// ─── SUB SCREENS ───
var inpS={width:“100%”,padding:“14px 16px”,borderRadius:“12px”,border:“1px solid #1E293B”,background:”#1E293B”,color:”#fff”,fontSize:“15px”,marginBottom:“10px”,outline:“none”,fontFamily:“inherit”};
var btnP={width:“100%”,padding:“15px”,borderRadius:“12px”,border:“none”,background:T.ac,color:”#fff”,fontSize:“15px”,fontWeight:“700”,cursor:“pointer”,marginTop:“6px”,fontFamily:“inherit”};

function LoginScr(p){
var e=useState(””),em=e[0],sEm=e[1];
var pw=useState(””),pass=pw[0],sPass=pw[1];
return h(“div”,{style:{minHeight:“100vh”,display:“flex”,flexDirection:“column”,justifyContent:“center”,padding:“24px”,background:T.dk}},
h(“div”,{style:{textAlign:“center”,marginBottom:“40px”}},
h(“div”,{style:{width:“56px”,height:“56px”,borderRadius:“16px”,margin:“0 auto 16px”,background:“linear-gradient(135deg,#C41E3A,#8B2252)”,display:“flex”,alignItems:“center”,justifyContent:“center”,boxShadow:“0 0 30px #C41E3A40”,fontSize:“24px”,color:”#fff”}},”\ud83d\udcf7”),
h(“div”,{style:{fontSize:“28px”,fontWeight:“800”,color:”#fff”}},“ShelfScan”,h(“span”,{style:{color:T.ac}},“Pro”)),
h(“div”,{style:{fontSize:“12px”,color:T.mt,marginTop:“4px”,letterSpacing:“2px”}},“DISLOG GROUP”)
),
h(“div”,null,
h(“input”,{value:em,onChange:function(x){sEm(x.target.value)},placeholder:“Email”,type:“email”,style:inpS}),
h(“input”,{value:pass,onChange:function(x){sPass(x.target.value)},placeholder:“Mot de passe”,type:“password”,style:inpS}),
p.err?h(“div”,{style:{color:T.dg,fontSize:“12px”,marginBottom:“12px”,textAlign:“center”}},p.err):null,
h(“button”,{onClick:function(){p.onLogin(em,pass)},disabled:p.ld||!em||!pass,style:btnP},p.ld?“Connexion…”:“Se connecter”),
h(“button”,{onClick:p.onReg,style:{width:“100%”,padding:“12px”,marginTop:“10px”,borderRadius:“12px”,border:“1px solid “+T.da,background:“transparent”,color:T.mt,fontSize:“13px”,cursor:“pointer”,fontFamily:“inherit”}},“Cr\u00e9er un compte”)
)
);
}

function RegScr(p){
var n=useState(””),nm=n[0],sN=n[1];
var e=useState(””),em=e[0],sE=e[1];
var pw=useState(””),pass=pw[0],sP=pw[1];
return h(“div”,{style:{minHeight:“100vh”,display:“flex”,flexDirection:“column”,justifyContent:“center”,padding:“24px”,background:T.dk}},
h(“div”,{style:{textAlign:“center”,marginBottom:“32px”}},
h(“div”,{style:{fontSize:“24px”,fontWeight:“800”,color:”#fff”}},“Cr\u00e9er un compte”),
h(“div”,{style:{fontSize:“12px”,color:T.mt,marginTop:“4px”}},“ShelfScan Pro \u2014 Dislog Group”)
),
h(“div”,null,
h(“input”,{value:nm,onChange:function(x){sN(x.target.value)},placeholder:“Nom complet”,style:inpS}),
h(“input”,{value:em,onChange:function(x){sE(x.target.value)},placeholder:“Email”,type:“email”,style:inpS}),
h(“input”,{value:pass,onChange:function(x){sP(x.target.value)},placeholder:“Mot de passe”,type:“password”,style:inpS}),
h(“button”,{onClick:function(){p.onReg(em,pass,nm)},disabled:p.ld||!em||!pass||!nm,style:btnP},p.ld?“Cr\u00e9ation…”:“Cr\u00e9er mon compte”),
h(“button”,{onClick:p.onLogin,style:{width:“100%”,padding:“12px”,marginTop:“10px”,borderRadius:“12px”,border:“none”,background:“transparent”,color:T.mt,fontSize:“13px”,cursor:“pointer”,fontFamily:“inherit”}},“D\u00e9j\u00e0 un compte ? Se connecter”)
)
);
}

function HomeScr(p){
return h(“div”,{style:{padding:“16px 16px 20px”}},
h(“div”,{style:{display:“flex”,justifyContent:“space-between”,alignItems:“center”,marginBottom:“20px”}},
h(“div”,null,
h(“div”,{style:{fontSize:“13px”,color:T.sc}},“Bonjour,”),
h(“div”,{style:{fontSize:“22px”,fontWeight:“800”}},(p.user&&p.user.full_name)||“Merchandiser”)
),
h(“div”,{style:{width:“42px”,height:“42px”,borderRadius:“12px”,background:“linear-gradient(135deg,#C41E3A,#8B2252)”,display:“flex”,alignItems:“center”,justifyContent:“center”,color:”#fff”,fontSize:“16px”,fontWeight:“700”}},((p.user&&p.user.full_name)||“U”).charAt(0))
),
h(“div”,{style:{marginBottom:“20px”}},
h(“label”,{style:{fontSize:“11px”,fontWeight:“600”,color:T.sc,display:“block”,marginBottom:“6px”,textTransform:“uppercase”,letterSpacing:“1px”}},“Point de vente”),
h(“select”,{value:(p.sel&&p.sel.id)||””,onChange:function(e){var s=p.stores.find(function(x){return x.id===e.target.value});p.setSel(s)},style:{width:“100%”,padding:“12px 14px”,borderRadius:“12px”,border:“1px solid “+T.bd,background:T.sf,fontSize:“14px”,color:T.tx,fontFamily:“inherit”}},
h(“option”,{value:””},”\u2014 S\u00e9lectionner un magasin \u2014”),
p.stores.map(function(s){return h(“option”,{key:s.id,value:s.id},s.name)})
)
),
h(“div”,null,
h(“div”,{style:{fontSize:“11px”,fontWeight:“600”,color:T.sc,marginBottom:“10px”,textTransform:“uppercase”,letterSpacing:“1px”}},“Type d’audit”),
h(“div”,{style:{display:“grid”,gridTemplateColumns:“1fr 1fr”,gap:“10px”}},
TYPES.map(function(t){return h(“button”,{key:t.id,onClick:function(){p.setType(t)},style:{background:T.sf,border:“1px solid “+T.bd,borderRadius:“14px”,padding:“18px 14px”,cursor:“pointer”,textAlign:“left”,fontFamily:“inherit”}},
h(“div”,{style:{fontSize:“28px”,marginBottom:“8px”}},t.emoji),
h(“div”,{style:{fontSize:“14px”,fontWeight:“700”,color:T.tx,marginBottom:“3px”}},t.label),
h(“div”,{style:{fontSize:“11px”,color:T.sc}},t.desc)
)})
)
)
);
}

function CapScr(p){
return h(“div”,{style:{minHeight:“100vh”,display:“flex”,flexDirection:“column”,background:T.dk}},
h(“div”,{style:{padding:“16px”,display:“flex”,alignItems:“center”,gap:“12px”}},
h(“button”,{onClick:p.onBack,style:{background:“none”,border:“none”,color:”#fff”,cursor:“pointer”,fontSize:“20px”}},”\u2190”),
h(“div”,null,
h(“div”,{style:{fontSize:“16px”,fontWeight:“700”,color:”#fff”}},(p.type&&p.type.label)||“Audit”),
h(“div”,{style:{fontSize:“11px”,color:T.mt}},(p.store&&p.store.name)||“Magasin”)
)
),
h(“div”,{style:{flex:1,display:“flex”,flexDirection:“column”,alignItems:“center”,justifyContent:“center”,padding:“20px”}},
h(“div”,{style:{width:“100%”,maxWidth:“300px”,aspectRatio:“3/4”,border:“3px dashed rgba(148,163,184,.4)”,borderRadius:“20px”,display:“flex”,flexDirection:“column”,alignItems:“center”,justifyContent:“center”,gap:“16px”,padding:“24px”}},
h(“div”,{style:{fontSize:“48px”}},”\ud83d\udcf7”),
h(“div”,{style:{color:”#fff”,fontSize:“16px”,fontWeight:“600”,textAlign:“center”}},“Photographiez le rayon”),
h(“div”,{style:{color:T.mt,fontSize:“12px”,textAlign:“center”}},“Cadrez le rayon entier pour une analyse compl\u00e8te”)
),
h(“button”,{onClick:function(){p.fRef.current&&p.fRef.current.click()},style:{marginTop:“32px”,width:“72px”,height:“72px”,borderRadius:“50%”,background:T.ac,border:“4px solid rgba(196,30,58,.3)”,display:“flex”,alignItems:“center”,justifyContent:“center”,cursor:“pointer”,color:”#fff”,fontSize:“24px”,boxShadow:“0 0 30px rgba(196,30,58,.4)”}},”\ud83d\udcf7”),
h(“div”,{style:{marginTop:“10px”,fontSize:“12px”,color:T.mt}},“Appuyez pour capturer”)
)
);
}

function ResScr(p){
var k=(p.res&&p.res.kpis)||{};
return h(“div”,{style:{minHeight:“100vh”,background:T.bg}},
h(“div”,{style:{position:“relative”,width:“100%”,maxHeight:“220px”,overflow:“hidden”}},
p.img?h(“img”,{src:p.img.url,style:{width:“100%”,display:“block”,objectFit:“cover”,maxHeight:“220px”}}):null,
p.busy?h(“div”,{style:{position:“absolute”,top:0,left:0,right:0,bottom:0,background:“rgba(0,0,0,.6)”,display:“flex”,flexDirection:“column”,alignItems:“center”,justifyContent:“center”,gap:“12px”}},
h(“div”,{style:{fontSize:“24px”}},”\ud83d\udd0d”),
h(“span”,{style:{fontSize:“14px”,color:T.ac,fontWeight:“600”}},“Analyse IA en cours…”)
):null,
(!p.busy&&p.res)?h(“div”,{style:{position:“absolute”,bottom:“12px”,left:“12px”,right:“12px”,background:“rgba(0,0,0,.7)”,borderRadius:“10px”,padding:“8px 14px”,display:“flex”,alignItems:“center”,gap:“8px”}},
h(“span”,{style:{fontSize:“16px”}},”\u2705”),
h(“span”,{style:{fontSize:“13px”,fontWeight:“600”,color:”#fff”}},“Score “+p.res.score+”/100”)
):null
),
h(“div”,{style:{padding:“12px 16px 0”}},
h(“div”,{style:{fontSize:“18px”,fontWeight:“800”,marginBottom:“2px”}},(p.type&&p.type.label)||“Audit”),
h(“div”,{style:{fontSize:“12px”,color:T.sc}},(p.store&&p.store.name)||””)
),
(p.res&&!p.busy)?h(“div”,{style:{padding:“16px”}},
h(“div”,{style:{display:“grid”,gridTemplateColumns:“1fr 1fr”,gap:“10px”}},
h(KPI,{l:“Part de Lin\u00e9aire”,v:k.pdl+”%”,c:T.bl,t:“25%”}),
h(KPI,{l:“Facings Dislog”,v:””+k.ownF,sub:”/ “+k.totalF+” total”,c:T.ac}),
h(KPI,{l:“Ruptures (OOS)”,v:””+k.oosC,c:k.oosC>3?T.dg:T.gn}),
h(KPI,{l:“Taux Rupture”,v:k.oosR+”%”,c:T.or,t:”<5%”}),
h(KPI,{l:“Lin\u00e9aire Total”,v:k.linT+” cm”,c:T.sc}),
h(KPI,{l:“Conformit\u00e9 Prix”,v:k.priceC+”%”,c:parseFloat(k.priceC)>=90?T.gn:T.or,t:“95%”})
),
(p.res.oos&&p.res.oos.length>0)?h(“div”,{style:{marginTop:“14px”,padding:“14px”,borderRadius:“12px”,background:”#FEF2F2”,border:“1px solid #FECACA”}},
h(“div”,{style:{fontSize:“13px”,fontWeight:“700”,color:T.dg,marginBottom:“8px”}},”\u26a0\ufe0f Ruptures d\u00e9tect\u00e9es”),
p.res.oos.map(function(o,i){return h(“div”,{key:i,style:{fontSize:“12px”,color:T.tx,padding:“6px 0”,borderBottom:i<p.res.oos.length-1?“1px solid #FEE2E2”:“none”}},o.brand+” \u2014 “+o.sku)})
):null,
p.res.own?h(“div”,{style:{marginTop:“14px”,padding:“14px”,borderRadius:“12px”,background:T.sf,border:“1px solid “+T.bd}},
h(“div”,{style:{fontSize:“13px”,fontWeight:“700”,marginBottom:“10px”}},“D\u00e9tail par marque Dislog”),
p.res.own.map(function(b,i){return h(“div”,{key:i,style:{display:“flex”,justifyContent:“space-between”,alignItems:“center”,padding:“7px 0”,borderBottom:i<p.res.own.length-1?“1px solid “+T.bd:“none”}},
h(“span”,{style:{fontSize:“12px”,fontWeight:“600”}},b.brand),
h(“div”,{style:{display:“flex”,gap:“16px”,fontSize:“12px”}},
h(“span”,{style:{fontWeight:“600”}},b.facings+” fac.”),
b.oos>0?h(“span”,{style:{color:T.dg,fontWeight:“700”}},b.oos+” OOS”):h(“span”,{style:{color:T.gn}},”\u2713”)
)
)})
):null,
h(“div”,{style:{display:“flex”,gap:“10px”,marginTop:“20px”}},
h(“button”,{onClick:p.onReset,style:{flex:1,padding:“14px”,borderRadius:“12px”,border:“1px solid “+T.bd,background:T.sf,fontSize:“14px”,fontWeight:“600”,cursor:“pointer”,fontFamily:“inherit”}},“Nouvel Audit”),
h(“button”,{onClick:p.onReset,style:{flex:1,padding:“14px”,borderRadius:“12px”,border:“none”,background:T.ac,color:”#fff”,fontSize:“14px”,fontWeight:“600”,cursor:“pointer”,fontFamily:“inherit”}},“Terminer”)
)
):null
);
}

function KPI(p){
return h(“div”,{style:{background:T.sf,borderRadius:“12px”,padding:“14px 12px”,border:“1px solid “+T.bd}},
h(“div”,{style:{fontSize:“10px”,color:T.sc,marginBottom:“6px”}},p.l),
